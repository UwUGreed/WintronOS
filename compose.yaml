name: wintron-os
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: wintron
      POSTGRES_DB: wintron
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U wintron -d wintron"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "3" }
  migrate:
    build: .
    command: [npx, prisma, migrate, deploy]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wintron:${POSTGRES_PASSWORD}@db:5432/wintron
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
    logging: *logging
  app:
    build: .
    init: true
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wintron:${POSTGRES_PASSWORD}@db:5432/wintron
      DOCUMENT_STORAGE_PATH: /app/storage
      HOSTNAME: 0.0.0.0
    ports: ["127.0.0.1:3000:3000"]
    volumes: ["documents:/app/storage"]
    depends_on:
      migrate: { condition: service_completed_successfully }
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
  scheduler:
    build: .
    init: true
    command: [npx, tsx, scripts/jobs.ts, --watch]
    env_file: .env
    environment:
      DATABASE_URL: postgresql://wintron:${POSTGRES_PASSWORD}@db:5432/wintron
    depends_on:
      migrate: { condition: service_completed_successfully }
    restart: unless-stopped
    stop_grace_period: 30s
    logging: *logging
volumes:
  database:
  documents:
